name: .NET Build & Security Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build Release (Treat warnings as errors)
      run: dotnet build --no-restore -c Release -warnaserror

    - name: Publish Single-File Release Artifact
      run: dotnet publish -c Release -r win-x64 --self-contained false -o ./publish

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CDKurtarici-win-x64
        path: ./publish
